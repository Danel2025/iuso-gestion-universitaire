name: Déploiement

# Déclenchement manuel uniquement : aucun déploiement automatique.
# Secrets à créer par environnement GitHub (recette, production) :
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL (connexion directe pour les migrations).
on:
  workflow_dispatch:
    inputs:
      environnement:
        description: Environnement cible
        type: choice
        options: [recette, production]
        required: true

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environnement }}
    concurrency:
      group: deploy-${{ inputs.environnement }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ENV: ${{ inputs.environnement }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - name: Migrations
        run: pnpm run db:migrate
      - name: Build et déploiement
        run: pnpm run deploy
