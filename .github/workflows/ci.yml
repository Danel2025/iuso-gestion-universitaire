name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iuso
          POSTGRES_PASSWORD: iuso
          POSTGRES_DB: iuso_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U iuso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://iuso:iuso@localhost:5432/iuso_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://iuso:iuso@localhost:5432/iuso_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm exec tsc --noEmit
      - name: Tests unitaires
        run: pnpm test
      - name: Migrations sur une base vierge
        run: pnpm run db:migrate
      - name: Build
        run: pnpm run build
